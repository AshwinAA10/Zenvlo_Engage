name: CI Quality Gate

on:
  push:
    branches: [main, master, frontend_testing]
  pull_request:
    branches: [main, master, frontend_testing]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Backend Verification (Lint, Build, Jest Regression Tests)
  # ============================================================================
  backend-checks:
    name: Backend Checks (NestJS + Jest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres1234
          POSTGRES_DB: zenvlo_engage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Build Backend Bundle
        run: npm --prefix backend run build

      - name: Run Backend Regression Test Suite
        env:
          NODE_ENV: test
          PORT: 4001
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres1234
          POSTGRES_DB: zenvlo_engage_test
          JWT_SECRET: test_e2e_jwt_secret_only_zenvlo_engage_123456
          JWT_REFRESH_SECRET: test_e2e_jwt_refresh_secret_only_zenvlo_engage_123456
          WHATSAPP_PROVIDER: mock
        run: npm --prefix backend run test

  # ============================================================================
  # 2. Frontend Unit, Integration & Production Build
  # ============================================================================
  frontend-unit-and-build:
    name: Frontend Checks (Vitest + Next.js Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Run ESLint
        run: npm --prefix frontend run lint

      - name: Run Frontend Unit & Integration Tests with Coverage
        run: npm --prefix frontend run test:coverage

      - name: Validate Next.js Production Build
        run: npm --prefix frontend run build

  # ============================================================================
  # 3. End-to-End Browser Testing (Playwright)
  # ============================================================================
  e2e-tests:
    name: Browser E2E Tests (Playwright)
    needs: [backend-checks, frontend-unit-and-build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres1234
          POSTGRES_DB: zenvlo_engage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Backend Production Distribution
        run: npm --prefix backend run build

      - name: Install Playwright Browsers & OS Dependencies
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Apply Database Migrations to Test Database
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres1234
          POSTGRES_DB: zenvlo_engage_test
        run: npm --prefix backend run migration:run

      - name: Run Playwright End-to-End Test Suite
        env:
          CI: true
          NODE_ENV: test
          PORT: 3000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4001/api
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres1234
          POSTGRES_DB: zenvlo_engage_test
          JWT_SECRET: test_e2e_jwt_secret_only_zenvlo_engage_123456
          JWT_REFRESH_SECRET: test_e2e_jwt_refresh_secret_only_zenvlo_engage_123456
          WHATSAPP_PROVIDER: mock
          RATE_LIMIT_ENABLED: false
        run: npm --prefix frontend run test:e2e

      - name: Upload Playwright Test Report and Failure Traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
